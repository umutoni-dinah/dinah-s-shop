<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fiction neighbourly grocery shop." />
    <title>Dinah's Shop | Everyday groceries, made easy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
</head>

<body class="min-h-screen bg-yellow-50 text-gray-900">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min." />
    <header class="bg-white shadow">
        <nav aria-label="Main navigation" class="mx-auto max-w-6xl px-4">
            <div class="flex h-16 items-center justify-between">
                <a href="#home"
                    class="flex items-center gap-2 text-xl font-bold text-green-800 hover:text-green-600 focus:outline-green-700">
                    <img src="/images/pineapple.svg" alt="" class="h-16 w-16 object-contain" />
                    <span>Dinah's Grocery Shop</span>
                </a>

                <!-- Links shown from the md breakpoint up -->
                <div class="hidden items-center gap-4 md:flex">
                    <a href="#home" class="text-gray-700 hover:text-green-700 focus:outline-green-700">Home</a>
                    <a href="#shop" class="text-gray-700 hover:text-green-700 focus:outline-green-700">Shop</a>
                    <a href="#specials" class="text-gray-700 hover:text-green-700 focus:outline-green-700">Specials</a>
                    <a href="#about" class="text-gray-700 hover:text-green-700 focus:outline-green-700">Our story</a>
                    <a href="#contact" class="text-gray-700 hover:text-green-700 focus:outline-green-700">Contact</a>
                </div>

                <!-- Menu shown below the md breakpoint -->
                <details class="relative md:hidden">
                    <summary aria-label="Open navigation menu"
                        class="cursor-pointer rounded px-3 py-2 text-2xl text-gray-700 hover:bg-yellow-100 focus:outline-green-700">
                        ☰
                    </summary>

                    <div class="absolute right-0 z-10 mt-2 w-40 rounded bg-white p-3 shadow">
                        <a href="#home"
                            class="block rounded px-2 py-2 text-gray-700 hover:bg-yellow-100 focus:outline-green-700">Home</a>
                        <a href="#shop"
                            class="block rounded px-2 py-2 text-gray-700 hover:bg-yellow-100 focus:outline-green-700">Shop</a>
                        <a href="#specials"
                            class="block rounded px-2 py-2 text-gray-700 hover:bg-yellow-100 focus:outline-green-700">Specials</a>
                        <a href="#about"
                            class="block rounded px-2 py-2 text-gray-700 hover:bg-yellow-100 focus:outline-green-700">Our
                            story</a>
                        <a href="#contact"
                            class="block rounded px-2 py-2 text-gray-700 hover:bg-yellow-100 focus:outline-green-700">Contact</a>
                    </div>
                </details>
            </div>
        </nav>
    </header>
</body>

</html>
